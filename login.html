<!DOCTYPE html>
<html>
<head>
  <title>Singh Public School - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Singh Public School</h1>
    <p>Welcome to our official website</p>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="signup.html">Sign Up</a>
    <a href="login.html">Login</a>
  </nav>

  <section id="login">
    <h2>Login</h2>
    <form onsubmit="login(event)">
      <label>Name:</label><br>
      <input type="text" id="loginName" required><br><br>

      <label>Password:</label><br>
      <input type="password" id="loginPassword" required><br><br>

      <button type="submit">Login</button>
    </form>
    <p id="welcomeMessage"></p>
  </section>

  <footer>
    <p>&copy; 2026 Singh Public School</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
